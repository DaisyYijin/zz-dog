# L2TP/IPSec VPN（手机系统自带 VPN 功能，无需安装任何 App）
# 凭据由 setup_vpn.sh 自动生成到同目录 .env（勿提交到 git）
services:
  ipsec:
    image: hwdsl2/ipsec-vpn-server:latest
    container_name: l2tp-vpn
    restart: unless-stopped
    privileged: true
    env_file: .env
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
    volumes:
      - /lib/modules:/lib/modules:ro
      - ./data:/etc/ipsec.d
