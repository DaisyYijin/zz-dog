# SoftEther VPN：多用户 L2TP/IPSec + 网页管理台（5555）+ 每用户流量统计
# 凭据由 setup_vpn.sh 自动生成到同目录 .env（勿提交到 git）
# 注：不映射 TCP 443（被 xray 占用）；手机零 App 用系统自带 L2TP 连接
services:
  softether:
    image: siomiz/softethervpn:latest
    container_name: softether-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      - PSK=${PSK}
      - USERS=${USERS}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    ports:
      - "5555:5555/tcp"   # 网页管理台（HTTPS）
      - "500:500/udp"     # IPSec
      - "4500:4500/udp"   # IPSec NAT-T
      - "1701:1701/udp"   # L2TP
      - "1194:1194/udp"   # OpenVPN（可选，App 党可用）
